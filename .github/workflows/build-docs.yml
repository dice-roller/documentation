name: build-docs

on:
  push:
    branches: [main, develop, next, 'versions/*']
  pull_request:
    branches: [main, develop, next]
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-build-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-docs:
    # Fork PRs do not run build commands or upload artifacts.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.id == github.event.repository.id
    runs-on: ubuntu-latest
    env:
      BASE_PATH: >-
        ${{ github.event_name == 'push' && github.ref == 'refs/heads/main'
            && github.event.repository.name
            || github.event_name == 'push' && github.ref == 'refs/heads/next'
            && format('{0}/versions/next', github.event.repository.name)
            || github.event_name == 'push' && startsWith(github.ref, 'refs/heads/versions/')
            && format('{0}/{1}', github.event.repository.name, github.ref_name)
            || format('{0}/staging{1}', github.event.repository.name,
                github.event.pull_request.number && format('/pr-{0}', github.event.pull_request.number) || '') }}
      DOCS_PREVIEW: >-
        ${{ (github.event_name != 'push' || (github.ref != 'refs/heads/main' && github.ref != 'refs/heads/next' && !startsWith(github.ref, 'refs/heads/versions/')))
            && (github.event.pull_request.number && format('PR #{0} preview', github.event.pull_request.number) || 'Staging')
            || '' }}
      DOCS_BRANCH: ${{ github.head_ref || github.ref_name }}
      DOCS_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'

      - name: Build documentation
        run: |
          npm ci
          npm run docs:build

      - uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: docs/.vitepress/dist
          if-no-files-found: error
          retention-days: 7
